version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Next.js and React move together
      next-react:
        patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react*"]
      tooling:
        patterns: ["eslint*", "@eslint*", "prettier*", "@ianvs/*", "typescript"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
      # vitest and @vitest/* must share one exact version
      testing:
        patterns:
          [
            "vitest",
            "@vitest/*",
            "@vitejs/*",
            "@rolldown/*",
            "@babel/*",
            "@testing-library/*",
            "jsdom",
            "@playwright/*",
            "@axe-core/*"
          ]
    ignore:
      # ESLint 10 crashes eslint-config-next's React plugin
      - dependency-name: eslint
        versions: [">=10"]
      # typescript-eslint does not support TypeScript 7 yet
      - dependency-name: typescript
        versions: [">=7"]
      # babel-plugin-react-compiler 1.0 is built on Babel 7's AST: with Babel 8 it skips
      # components it cannot parse, so tests would run uncompiled code. Next bundles Babel 7.
      - dependency-name: "@babel/core"
        versions: [">=8"]
      # Types must match the Node runtime in .node-version (24)
      - dependency-name: "@types/node"
        versions: [">=25"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
